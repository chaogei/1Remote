name: Build/Publish on push

# Every commit that lands on main/master ships: the run bumps Ui/AppVersion.cs, pushes that bump back
# to the branch, builds it, tags it and publishes a full (non-prerelease) GitHub release, all in the
# same run. A push made with GITHUB_TOKEN does not start another workflow run, which is what stops the
# bump commit from triggering an endless chain of releases.
on:
  push:
    branches:
      - "*master*"
      - "*main*"
    tags:
      - "*"
  # lets a build be started from the Actions tab without pushing another commit
  workflow_dispatch:

# Two pushes landing seconds apart would otherwise both read the same Build number out of
# AppVersion.cs and try to mint the same tag. Queue instead of cancelling: a cancelled run can leave
# the bump commit on the branch with no release behind it.
concurrency:
  group: build-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  JobBuild:
    permissions:
      contents: write # for release-drafter/release-drafter to create a github release
    name: build_and_release
    runs-on: windows-latest
    if: |
      !contains(github.event.head_commit.message, 'WIP')

    env:
      configuration: Release
      Main_Project: Ui/Ui.csproj
      Action_Url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Echo
        shell: pwsh
        run: |
          echo "url = $env:Action_Url"
          echo "home = $HOME"
          echo "github.ref = ${{ github.ref }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          # the bump commit and its tag are pushed back with this token
          persist-credentials: true

      # The release version is minted here, before the compile, so the binary, the artifact names, the
      # tag and the release title all carry the same number. Not on a tag push (that commit is already
      # a versioned snapshot), not on workflow_dispatch (no commit to release), and not on the bot's
      # own bump commit - GITHUB_TOKEN should never retrigger the workflow, but the check is free.
      - name: Bump version
        id: bump
        if: |
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
          !startsWith(github.event.head_commit.message, 'chore(release):')
        shell: pwsh
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Git {
            git @args
            if ($LASTEXITCODE -ne 0) { throw "git $($args -join ' ') failed with exit code $LASTEXITCODE" }
          }

          Invoke-Git config user.name 'github-actions[bot]'
          Invoke-Git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          Invoke-Git fetch --tags --force --quiet

          $bump = ./scripts/Bump-Version.ps1
          Invoke-Git add Ui/AppVersion.cs
          Invoke-Git commit -m "chore(release): $($bump.Version)"

          git push origin "HEAD:refs/heads/$env:BRANCH"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not push the bump commit to $env:BRANCH - the branch most likely moved while this run was building. Nothing was released; re-run the workflow on the new tip."
          }

          $sha = (git rev-parse HEAD).Trim()
          Write-Host "Release $($bump.Tag) will be cut from $sha"
          "ReleaseTag=$($bump.Tag)" >> $env:GITHUB_ENV
          "BumpCommit=$sha" >> $env:GITHUB_ENV

      # A hand-pushed tag publishes the tag it names, at the version already committed under it.
      - name: Resolve the release tag of a tag push
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: '"ReleaseTag=${{ github.ref_name }}" >> $env:GITHUB_ENV'

      # Install the .NET Core workload https://github.com/actions/setup-dotnet
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            9.0.x

      # Add MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      # cache nuget packages: https://github.com/actions/cache
      - name: Cache nuget packages
        id: cache-nuget-packages
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}\.nuget\packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Ui/Ui.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache nuget packages home # https://github.com/actions/cache
        id: cache-nuget-packages-home
        uses: actions/cache@v3
        with:
          path: C:\Users\runneradmin\.nuget\packages
          key: ${{ runner.os }}-nuget-home-${{ hashFiles('Ui/Ui.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-home

      # Restore nuget packages
      - name: Restore nuget packages 📦️
        run: msbuild $env:Main_Project /t:Restore /p:Configuration=$env:Configuration

      # Run script
      - name: Run script
        shell: pwsh
        run: |
          # A fork does not inherit the upstream repository's secrets, and Set-Secret.ps1 exits 1 on an empty
          # one. Skipping the substitution instead leaves the placeholder constant in Assert.cs, which
          # compiles and runs: telemetry is simply inert. Note that the encryption salt then falls back to a
          # publicly known constant, so a build produced this way must not be pointed at a password store
          # created by an official release.
          $replacements = @(
            @{ Pattern = "===REPLACE_ME_WITH_SENTRY_IO_DEN==="    ; Value = "${{ secrets.SENTRY_IO_DEN }}" },
            @{ Pattern = "===REPLACE_ME_WITH_SALT==="             ; Value = "${{ secrets.GLOBAL_STRING_ENCRYPTION_SLAT }}" }
          )
          foreach ($r in $replacements) {
            if ([string]::IsNullOrWhiteSpace($r.Value)) {
              Write-Host "::warning::No secret configured for $($r.Pattern), keeping the placeholder."
              continue
            }
            ./scripts/Set-Secret.ps1 -filePath .\Ui\Assert.cs -Pattern $r.Pattern -Secret $r.Value
          }

      # Get ${{env.BuildVersion}} and ${{env.PreRelease}}
      - name: Get Version
        id: get_version
        run: ./scripts/Get-Version.ps1

      # echo ${{env.BuildVersion}} and ${{env.PreRelease}}
      # - name: Echo Version
      #   shell: pwsh
      #   if: ${{env.PreRelease}} != ""
      #   run: |
      #     echo ${{env.BuildVersion}}
      #     echo ${{env.PreRelease}}

      ## Publish the application Net4.8
      #- name: Publish the application Net4.8
      #  run: dotnet publish $env:Main_Project -p:PublishProfile=./Ui/Properties/PublishProfiles/x64-net48.pubxml
      #  # run: msbuild $env:Main_Project -t:rebuild -verbosity:diag -property:Configuration=ReleaseNet48
      ## artifact
      #- uses: actions/upload-artifact@v4
      #  with:
      #    name: 1Remote-${{env.BuildVersion}}-net4.8(not recommended)
      #    path: Ui/bin/Release/net4.8-windows/publish

      # # Publish the application Net6.0
      # - name: Publish the application net6
      #   run: dotnet publish $env:Main_Project -p:PublishProfile=./Ui/Properties/PublishProfiles/x64-net60.pubxml
      # # artifact
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: 1Remote-${{env.BuildVersion}}-net6-x64
      #     path: Ui/bin/Release/net6.0-windows/publish/win-x64

      # Publish the application net9.0
      - name: Publish the application net9
        run: dotnet publish $env:Main_Project -p:PublishProfile=./Ui/Properties/PublishProfiles/x64-net90.pubxml
      # artifact
      - uses: actions/upload-artifact@v4
        with:
          name: 1Remote-${{env.BuildVersion}}-net9-x64
          path: Ui/bin/Release/net9.0-windows/publish/win-x64

      # Publish the application net9.0
      - name: Publish x64-net90-self-contained
        run: dotnet publish $env:Main_Project -p:PublishProfile=./Ui/Properties/PublishProfiles/x64-net90-self-contained.pubxml
      # artifact
      - uses: actions/upload-artifact@v4
        with:
          name: 1Remote-${{env.BuildVersion}}-net9-x64-self-contained
          path: Ui/bin/Release/net9.0-windows-self-contained/publish/win-x64

      # Last, so that a build that never produced artifacts leaves no tag pointing at a version nobody
      # can download. BumpCommit is only set when this run bumped, so a tag push does not re-tag.
      - name: Tag the release commit
        if: env.BumpCommit != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:ReleaseTag
          $sha = $env:BumpCommit

          if (git ls-remote --tags origin "refs/tags/$tag") {
            Write-Host "::warning::Tag $tag already exists on the remote, leaving it untouched."
            exit 0
          }

          git tag -a $tag -m $tag $sha
          if ($LASTEXITCODE -ne 0) { throw "could not create tag $tag" }
          git push origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "could not push tag $tag" }

    outputs:
      BuildVersion: ${{env.BuildVersion}}
      PreRelease: ${{env.PreRelease}}
      # Empty unless this run has something to publish: either the tag it just minted and pushed, or
      # the tag that triggered it. StableRelease keys off this instead of github.ref, which on a
      # branch push names the branch.
      ReleaseTag: ${{env.ReleaseTag}}
      ReleaseCommit: ${{env.BumpCommit || github.sha}}
      # artifact_net48: 1Remote-${{env.BuildVersion}}-net4.8(not recommended)
      # artifact_net6x: 1Remote-${{env.BuildVersion}}-net6-x64
      artifact_net9x: 1Remote-${{env.BuildVersion}}-net9-x64
      artifact_net9xsc: 1Remote-${{env.BuildVersion}}-net9-x64-self-contained

  # Publishes the full release: a push to main/master publishes the tag the bump above minted, a
  # hand-pushed tag publishes itself. Never a pre-release - the bump clears AppVersion.PreRelease
  # before Get-Version runs, so the version carries no -beta suffix either.
  StableRelease:
    name: Stable publish
    runs-on: ubuntu-latest
    needs: JobBuild
    # granted per job, because a repository whose default workflow permission is read-only - which is the
    # default for a new one, and for a fork - otherwise fails create-release with "Resource not accessible
    # by integration"
    permissions:
      contents: write
    # This publishes to the repository the push happened in, a fork included: create-release and
    # upload-release-asset both act on github.repository, and a fork's own GITHUB_TOKEN can write its
    # releases. Only NightlyRelease stays pinned to upstream, because it uploads into a release id there.
    if: |
      needs.JobBuild.outputs.ReleaseTag != '' &&
      !contains(github.event.head_commit.message, 'WIP')
    steps:
      - name: Echo
        run: |
          echo ${{needs.JobBuild.outputs.BuildVersion}}
          echo ${{needs.JobBuild.outputs.ReleaseTag}}
          echo ${{needs.JobBuild.outputs.ReleaseCommit}}

      # The tag, not github.ref: on a branch push github.ref is the branch, whose tip is the bump
      # commit the build job just pushed and tagged.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{needs.JobBuild.outputs.ReleaseTag}}
          submodules: recursive

      ## download artifact net4.8
      #- uses: actions/download-artifact@v4.1.7
      #  with:
      #    name: ${{needs.JobBuild.outputs.artifact_net48}}
      #    path: ${{needs.JobBuild.outputs.artifact_net48}}
      ## zip
      #- name: Easy Zip Files
      #  uses: vimtor/action-zip@v1
      #  with:
      #    files: ${{needs.JobBuild.outputs.artifact_net48}}
      #    dest: ${{needs.JobBuild.outputs.artifact_net48}}.zip

      # # download artifact net6.x & ZIP
      # - uses: actions/download-artifact@v4.1.7
      #   with:
      #     name: ${{needs.JobBuild.outputs.artifact_net6x}}
      #     path: ${{needs.JobBuild.outputs.artifact_net6x}}
      # - name: Easy Zip Files
      #   uses: vimtor/action-zip@v1
      #   with:
      #     files: ${{needs.JobBuild.outputs.artifact_net6x}}
      #     dest: ${{needs.JobBuild.outputs.artifact_net6x}}.zip

      # download artifact net9.x & ZIP
      - uses: actions/download-artifact@v4.1.7
        with:
          name: ${{needs.JobBuild.outputs.artifact_net9x}}
          path: ${{needs.JobBuild.outputs.artifact_net9x}}
      - name: Easy Zip Files
        uses: vimtor/action-zip@v1
        with:
          files: ${{needs.JobBuild.outputs.artifact_net9x}}
          dest: ${{needs.JobBuild.outputs.artifact_net9x}}.zip
      - uses: actions/download-artifact@v4.1.7
        with:
          name: ${{needs.JobBuild.outputs.artifact_net9xsc}}
          path: ${{needs.JobBuild.outputs.artifact_net9xsc}}
      - name: Easy Zip Files
        uses: vimtor/action-zip@v1
        with:
          files: ${{needs.JobBuild.outputs.artifact_net9xsc}}
          dest: ${{needs.JobBuild.outputs.artifact_net9xsc}}.zip

      # make release
      - name: Generate release notes from git log
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{needs.JobBuild.outputs.ReleaseTag}}
        run: |
          NOTES="$(mktemp)"
          trap 'rm -f "$NOTES"' EXIT
          # the script walks back to the previous tag, so it needs all of them, not just the one
          # this run checked out
          git fetch --tags --force origin
          bash .github/scripts/release-notes.sh "$RELEASE_TAG" > "$NOTES"
          {
            echo 'body<<NOTES_EOF'
            cat "$NOTES"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{needs.JobBuild.outputs.ReleaseTag}}
          # Bare tag, no "Release " prefix: every release up to v1.3.0.9-beta was titled after its tag,
          # because changelogithub renamed them on the way out. Now that it is gone, the title this step
          # sets is the one that sticks, so it has to match.
          release_name: ${{needs.JobBuild.outputs.ReleaseTag}}
          # only used if the tag step above somehow did not create the tag; an existing tag wins
          commitish: ${{needs.JobBuild.outputs.ReleaseCommit}}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false

      ## upload package net4.8
      #- name: Upload Release Asset
      #  uses: actions/upload-release-asset@v1
      #  env:
      #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #  with:
      #    upload_url: ${{ steps.create_release.outputs.upload_url }}
      #    asset_path: ${{needs.JobBuild.outputs.artifact_net48}}.zip
      #    asset_name: ${{needs.JobBuild.outputs.artifact_net48}}.zip
      #    asset_content_type: application/zip

      # # upload package net6.x
      # - name: Upload Release Asset net6
      #   uses: actions/upload-release-asset@v1
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
      #     asset_path: ${{needs.JobBuild.outputs.artifact_net6x}}.zip
      #     asset_name: ${{needs.JobBuild.outputs.artifact_net6x}}(obsolete).zip
      #     asset_content_type: application/zip
      #     prerelease: false

      # upload package net9.x
      - name: Upload Release Asset net9
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: ${{needs.JobBuild.outputs.artifact_net9x}}.zip
          asset_name: ${{needs.JobBuild.outputs.artifact_net9x}}.zip
          asset_content_type: application/zip
      - name: Upload Release Asset net9xsc
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: ${{needs.JobBuild.outputs.artifact_net9xsc}}.zip
          asset_name: ${{needs.JobBuild.outputs.artifact_net9xsc}}.zip
          asset_content_type: application/zip

  # publish nightly build
  NightlyRelease:
    name: Nightly publish
    runs-on: ubuntu-latest
    needs: JobBuild
    # The release this uploads to is hardcoded to the upstream repository, and a fork's GITHUB_TOKEN has no
    # access to it — the step fails with "Not Found". Forks still get the build and its artifacts.
    if: |
      github.repository == '1Remote/1Remote' &&
      !contains(github.event.head_commit.message, 'WIP')
    steps:
      - name: Echo
        run: |
          echo ${{needs.JobBuild.outputs.BuildVersion}}
          echo ${{needs.JobBuild.outputs.PreRelease}}

      # download artifact net9.x & ZIP
      - uses: actions/download-artifact@v4.1.7
        with:
          name: ${{needs.JobBuild.outputs.artifact_net9x}}
          path: ${{needs.JobBuild.outputs.artifact_net9x}}
      - uses: vimtor/action-zip@v1
        with:
          files: ${{needs.JobBuild.outputs.artifact_net9x}}
          dest: ${{needs.JobBuild.outputs.artifact_net9x}}.zip
      - uses: actions/download-artifact@v4.1.7
        with:
          name: ${{needs.JobBuild.outputs.artifact_net9xsc}}
          path: ${{needs.JobBuild.outputs.artifact_net9xsc}}
      - uses: vimtor/action-zip@v1
        with:
          files: ${{needs.JobBuild.outputs.artifact_net9xsc}}
          dest: ${{needs.JobBuild.outputs.artifact_net9xsc}}.zip

      # for 1Remote project
      # publish nightly with WebFreak001/deploy-nightly@v2.0.0
      - uses: WebFreak001/deploy-nightly@v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # automatically provided by github actions
        with:
          upload_url: https://uploads.github.com/repos/1Remote/1Remote/releases/96075099/assets{?name,label} # find out this value by opening https://api.github.com/repos/<owner>/<repo>/releases in your browser and copy the full "upload_url" value including the {?name,label} part
          release_id: 96075099 # same as above (id can just be taken out the upload_url, it's used to find old releases)
          asset_path: ${{needs.JobBuild.outputs.artifact_net9x}}.zip # path to archive to upload
          asset_name: ${{needs.JobBuild.outputs.artifact_net9x}}-nightly-$$.zip # name to upload the release as, use $$ to insert date (YYYYMMDD) and 6 letter commit hash
          asset_content_type: application/zip # required by GitHub API
          max_releases: 20 # optional, if there are more releases than this matching the asset_name, the oldest ones are going to be deleted

      - uses: WebFreak001/deploy-nightly@v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # automatically provided by github actions
        with:
          upload_url: https://uploads.github.com/repos/1Remote/1Remote/releases/96075099/assets{?name,label} # find out this value by opening https://api.github.com/repos/<owner>/<repo>/releases in your browser and copy the full "upload_url" value including the {?name,label} part
          release_id: 96075099 # same as above (id can just be taken out the upload_url, it's used to find old releases)
          asset_path: ${{needs.JobBuild.outputs.artifact_net9xsc}}.zip # path to archive to upload
          asset_name: ${{needs.JobBuild.outputs.artifact_net9x}}-nightly-$$-self-contained.zip # name to upload the release as, use $$ to insert date (YYYYMMDD) and 6 letter commit hash
          asset_content_type: application/zip # required by GitHub API
          max_releases: 20 # optional, if there are more releases than this matching the asset_name, the oldest ones are going to be deleted
